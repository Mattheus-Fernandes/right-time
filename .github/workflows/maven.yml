name: Java CI with Maven

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'refactor/**'

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate version
        shell: bash
        run: |
          VERSION=$(mvn help:evaluate \
            -Dexpression=project.version \
            -q \
            -DforceStdout)

          echo "Project version: $VERSION"
          echo "Branch: $GITHUB_HEAD_REF"

          BRANCH="$GITHUB_HEAD_REF"

          if [[ -z "$BRANCH" ]]; then
            BRANCH="$GITHUB_REF_NAME"
          fi

          # ==========================================================
          # Validate SNAPSHOT / RELEASE
          # ==========================================================

          if [[ "$BRANCH" == "main" ]]; then

            if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
              echo "ERROR: main must use a release version."
              exit 1
            fi

          else

            if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
              echo "ERROR: development branches must use a SNAPSHOT version."
              exit 1
            fi

            # ========================================================
            # Validate unique SNAPSHOT version
            # ========================================================

            echo "Checking if SNAPSHOT version was already used..."

            if git log --all --format='%H' -- pom.xml | while read COMMIT; do
              PREVIOUS_VERSION=$(git show "$COMMIT:pom.xml" 2>/dev/null \
                | grep -m1 '<version>' \
                | sed 's/.*<version>\(.*\)<\/version>.*/\1/')

              if [[ "$PREVIOUS_VERSION" == "$VERSION" ]]; then
                echo "ERROR: SNAPSHOT version $VERSION was already used."
                exit 0
              fi
            done | grep -q "ERROR:"; then

              echo "ERROR: SNAPSHOT version $VERSION was already used."
              echo "Please increment the project version."
              exit 1
            fi

            echo "SNAPSHOT version $VERSION is valid and has not been used before."

          fi

      - name: Build with Maven
        run: mvn -B clean verify
